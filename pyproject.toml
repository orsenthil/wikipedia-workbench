[project]
name = "editor"
version = "0.1.0"
description = "Wikipedia Workbench: a personal workbench for focused Wikipedia editing"
authors = [
    { name = "Senthil Kumaran", email = "senthil@python.org" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "mwparserfromhell>=0.7.2",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
editor = "editor:main"
editor-hash-password = "editor.auth:cli"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]
